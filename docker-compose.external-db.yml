# App only — Postgres from external provider (Neon, Supabase, Railway, managed, etc.).
#
# Usage:
#   cp .env.example .env
#   # Set DATABASE_URL to external Postgres (prefer ?sslmode=require)
#   # Set PUBLIC_BASE_URL to HTTPS public origin
#   # Set ORDER_VIEW_SECRET, BAYAR_*, DISCORD_*, TURNSTILE_*, ADMIN_*
#   # Do NOT set TURNSTILE_BYPASS in production
#   docker compose -f docker-compose.external-db.yml up -d --build
#
# Notes:
#   - No bundled db service; nothing listens on host :5432 from this file.
#   - Entrypoint runs migrations then starts the app.
#   - Do not use together with docker-compose.yml (two apps / two configs).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Loopback only — reverse proxy (Caddy/Nginx) is the ONLY public entrance.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      # Required — fail fast if missing from .env / shell
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env for external Postgres}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL (HTTPS in production)}
      BAYAR_GG_API_KEY: ${BAYAR_GG_API_KEY:-}
      BAYAR_GG_BASE_URL: ${BAYAR_GG_BASE_URL:-https://www.bayar.gg/api}
      BAYAR_GG_PAYMENT_URL: ${BAYAR_GG_PAYMENT_URL:-https://www.bayar.gg/pay}
      BAYAR_GG_PAYMENT_METHOD: ${BAYAR_GG_PAYMENT_METHOD:-qris}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Empty in production. "1" only for local dev.
      TURNSTILE_BYPASS: ${TURNSTILE_BYPASS:-}
      # HMAC for /order/success?order=&t= — set a long random value in production
      ORDER_VIEW_SECRET: ${ORDER_VIEW_SECRET:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # No weak defaults — empty means seed is skipped / refused (same as main compose)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Admin panel path prefix (default: /admin). Gunakan slug acak di production.
      ADMIN_PATH: ${ADMIN_PATH:-/admin}
