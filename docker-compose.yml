# Default stack: app + Postgres (bundled).
# External DB only: see docker-compose.external-db.yml
#
# Usage:
#   cp .env.example .env   # isi secret, PUBLIC_BASE_URL, bayar, dll.
#   docker compose up -d --build
#
# App: http://localhost:${APP_PORT:-3000}
# Admin: http://localhost:${APP_PORT:-3000}{ADMIN_PATH}/login (default ADMIN_PATH=/admin)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tokenizer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tokenizer}
      POSTGRES_DB: ${POSTGRES_DB:-tokenizer}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only — never publish Postgres on 0.0.0.0 (production hardening).
      # App talks to db over the internal Compose network; host tools use 127.0.0.1.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tokenizer} -d ${POSTGRES_DB:-tokenizer}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Loopback only — reverse proxy (Caddy/Nginx) is the ONLY public entrance.
      # App must never be reachable directly from the internet: it would bypass
      # TLS, real-IP handling, and any proxy-level protections.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      # Internal Docker DNS — overrides host .env DATABASE_URL so app always hits compose db
      DATABASE_URL: postgres://${POSTGRES_USER:-tokenizer}:${POSTGRES_PASSWORD:-tokenizer}@db:5432/${POSTGRES_DB:-tokenizer}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      BAYAR_GG_API_KEY: ${BAYAR_GG_API_KEY:-}
      BAYAR_GG_BASE_URL: ${BAYAR_GG_BASE_URL:-https://www.bayar.gg/api}
      BAYAR_GG_PAYMENT_URL: ${BAYAR_GG_PAYMENT_URL:-https://www.bayar.gg/pay}
      BAYAR_GG_PAYMENT_METHOD: ${BAYAR_GG_PAYMENT_METHOD:-qris}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_BYPASS: ${TURNSTILE_BYPASS:-}
      ORDER_VIEW_SECRET: ${ORDER_VIEW_SECRET:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # No weak defaults — set strong ADMIN_PASSWORD (min 12 chars) or seed is refused
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Admin panel path prefix (default: /admin). Gunakan slug acak di production.
      ADMIN_PATH: ${ADMIN_PATH:-/admin}

volumes:
  pgdata:
